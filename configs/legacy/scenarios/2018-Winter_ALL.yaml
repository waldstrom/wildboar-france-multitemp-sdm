# =============================================================================
# Project Title: Wild Boar Distribution Model for France
# Path: config.yaml
# Purpose: Core configuration file for pipeline parameters.
# Process Step: Defines model settings, data paths and environment grid info.
# Created by Adrian Meyer, Institute Geomatics, FHNW (adrian.meyer@fhnw.ch)
# Created: July 2025
# Version: v.0.1.0
# =============================================================================
# ============================================================================
#  Wild boar habitat suitability modelling (MaxEnt / elapid) - baseline config
#  Study area: metropolitan France (EPSG:2154, 1 km x 1 km grid, no Corsica)
#  Valid for presence records and predictors covering 2017-2023 inclusive
# ============================================================================

experiment:
  # Optional experiment identifier. Leave empty to automatically
  # create a new directory `exps/exp_<timestamp>` when running the
  # pipeline. Set to a custom name to use `exps/<name>` instead.
  name: ""
  random_seed: 42           # Used everywhere (thinning, background, CV, Optuna)
  verbose_console: true     # Print progress messages during every major step

steps:                      # Enable/disable pipeline stages
  preprocessing: true
  variable_selection: true
  thinning: true
  bias_grid: true
  background: true
  training: true
  evaluation: true
  variable_importance: true

# ---------------------------------------------------------------------------
# 1  Presence-only data
# ---------------------------------------------------------------------------
presence_data:
  file: data/allpoints.csv  # Contains dd long, dd lat, year-int, month-int, source, season, semester, month
  crs: EPSG:2154
  # Optional list of data sources to include (values from the 'source' column)
  # e.g. [GBIF, RRN, SNCF]. Leave empty or comment out to use all records.
  source_filter: null
  # year_filter: [2017, 2024] # Inclusive range applied after reading the CSV
  year_filter: [2018, 2018]
  season_filter: null  # Deprecated - use ``seasons.active``
  thinning:
    enable: true
    # Configure one or more thinning stages. They are executed sequentially
    # in the order listed below. Remove a block if you only want a single
    # approach. Method names correspond to the implementations in
    # `scripts/thinning.py`.
    methods:
      - name: grid                # Method 1 – fishnet sampling
        enable: false              # First spatially thin using a 10 km grid
        params:
          grid_size_km: 10        # Cell size for the fishnet
      - name: mahalanobis         # Method 2 – percentage based
        enable: true
        params:
          variables: null         # If null -> use the selected predictors
          percentage:
            RRN: 0.4
            GBIF: 0.6
            SNCF: 1.0
    save_thinned_points: outputs/thinned_presence.geojson

# ---------------------------------------------------------------------------
# 1b Seasons available for filtering
# ---------------------------------------------------------------------------
seasons:
  active:
    - 2018-Winter

# ---------------------------------------------------------------------------
# 2  Bias grid options (turned off by default)
# ---------------------------------------------------------------------------
bias_grid:
  enable: true
  strategy: predefined   # options: occurrence_density, lc_urban, predefined
  file: data/bias-maps/Combined_2018-Winter.asc
  pattern: data/bias-maps/Combined_2018-Winter.asc
  kernel_bandwidth_km: 30   # Silverman rule of thumb if left empty
  resolution_km: 1
  alpha: 3                  # Decay rate for lc_urban strategy
  output_file: outputs/bias/bias.tif

# ---------------------------------------------------------------------------
# 3  Background (pseudo-absence) sampling
# ---------------------------------------------------------------------------
background:
  n_points: 10000           # Default; can be tuned by Optuna
  use_bias_grid: true       # If true -> probability-weighted sampling from bias
  tuneable: true            # Allow Optuna to search n_points within bounds
  bounds: [20000, 100000]   # Only considered if tuneable = true
  output_file: outputs/background_pts.gpkg

# ---------------------------------------------------------------------------
# 4  Environmental predictors
# ---------------------------------------------------------------------------
predictors:
  target_resolution_m: 1000
  resampling_method:
    continuous: bilinear
    categorical: nearest
  nodata_value: -9999
  variable_selection:
    # Parameters controlling the Bosch et al. selection procedure. Adjust these
    # if you want to tighten or loosen the filtering of predictors.
    correlation_cutoff: 0.7 # Hierarchical clustering threshold (Dormann et al. 2013)
    vif_threshold: 12        # Sequential VIF pruning threshold (relaxed)
    vif_by_group:
      "1": 15
    linkage: average        # Cluster-linkage method
    sample_fraction: 0.01   # Fraction of cells used for correlation
    reference_year: 2018
    lc_reference_year_only: true
    save_selected_list: outputs/selected_predictors.txt
    feature_config: configs/features/featureconfig.yaml

  layers:                   # Path patterns accepted by glob()
    # --- Climatic (static) ---
    bioclim: data/bioclim/*.asc
    # --- Land-cover fractions, one raster per class per year ---
    landcover_fraction:
      pattern: data/land-cover/{year}_class{class}.asc
      # years: [2017, 2018, 2019, 2020, 2021, 2022, 2023]
      years: [2018]
      classes:
        - 1_WHEAT
        - 2_CORNMAIZ
        - 3_BARLEY
        - 4_RAPESEED
        - 5_AGRILAND
        - 6_GRASSLND
        - 7_OAKGROVE
        - 8_CONIFERS
        - 9_MIXFORST
        - 10_BEECHGRV
        - 11_URBAN
        - 12_WATER
        - 13_OTHER
    # --- Land-cover class distances ---
    landcover_distance:
      pattern: data/lc-distances/{year}_class{class}_distance.asc
      # years: [2017, 2018, 2019, 2020, 2021, 2022, 2023]
      years: [2018]
      classes:
        - 0_BGROUND
        - 1_WHEAT
        - 2_CORNMAIZ
        - 3_BARLEY
        - 4_RAPESEED
        - 5_AGRILAND
        - 6_GRASSLND
        - 7_OAKGROVE
        - 8_CONIFERS
        - 9_MIXFORST
        - 10_BEECHGRV
        - 11_URBAN
        - 12_WATER
        - 13_OTHER
    # --- Vegetation indices (Sentinel-2 composites) ---
    veg_index:
      pattern: data/sat-indices/{index}/{year}_{month}_{index_lc}.tif
      # years: [2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
      years: [2018]
      months: [04, 07, 10]
      indices: [BSI, EVI, EVI2, MSAVI, NBR, NDBI,
                NDMI, NDSI, NDVI, NDWI, VSSI]
    hunting_bag:
      pattern: data/hunting-bag/hunting_bag_{year}.asc
      # years: [2017, 2018, 2019, 2020, 2021, 2022, 2023]
      years: [2018]
    theia_special:
      files:
        - data/theia-special/LC01_Dense_Urbanization.asc
        - data/theia-special/LC03_Industrial_Zones.asc
        - data/theia-special/LC14_Fruit_Orchards.asc
        - data/theia-special/LC15_Vineyards.asc
        - data/theia-special/LC19_Natural_Heath.asc
        - data/theia-special/LC20_Rocky_Surfaces.asc
        - data/theia-special/LC21_Beaches_Dunes.asc
        - data/theia-special/LC22_Snowy_Glaciers.asc
      categorical: false
    theia_special_distance:
      pattern: data/theia-special/*_distance.asc
      categorical: false
    special:
      pattern: data/special/*.asc
    # --- DEM derivatives ---
    dem:
      - data/dem/DEM_Altitude.asc
      - data/dem/DEM_Slope.asc
      - data/dem/DEM_Terrain_Ruggedness.asc
      - data/dem/DEM_Aspect.asc
      - data/dem/DEM_Elevation_Range.asc
    # --- Anthropogenic & other ---
# ---------------------------------------------------------------------------
# 5  Train-test split
# ---------------------------------------------------------------------------
train_test_split:
  fixed_test_set: false     # Set to true and provide path below to reuse
  test_set_file: null
  proportion: 0.2           # Ignored if fixed_test_set = true
  stratify_by: dataset      # Keep same dataset proportion in train/test
  sample_stage: post_thin   # options: pre_bias, post_bias, post_thin

# ---------------------------------------------------------------------------
# 6  Modelling (elapid / MaxEnt)
# ---------------------------------------------------------------------------
maxent:
  engine: elapid
  output_type: cloglog
  feature_types: [linear, hinge, product, quadratic]
  n_hinge_features: 30
  regularization_multiplier: 1.0
  max_iterations: 1000
  num_background: ${background.n_points}   # Jinja-style dereference
  convergence_tolerance: 0.00001
  threads: -1
  export_geotiff: true
  geotiff_compression: LZW
  save_rdata: false         # Save Java MaxEnt RDA if bridging to R

# ---------------------------------------------------------------------------
# 7  Evaluation & cross-validation
# ---------------------------------------------------------------------------
evaluation:
  metrics: [AUC, boyce, omission_rate, pr_curve]
  classification_threshold: auto
  cross_validation:
    enable: false
    # method can be a single value or list to run several methods
    method: spatial_block   # options: random_kfold, spatial_block, geographic_kfold, env_block, compare
    params:
      k_folds: 5
      block_size_km: 50
    script: scripts/run_cv.py

# ---------------------------------------------------------------------------
# 8  Variable importance (optional)
# ---------------------------------------------------------------------------
variable_importance:
  permutation:
    enable: true
    n_repeats: 5
  gain:
    enable: false
  jackknife:
    enable: false

# ---------------------------------------------------------------------------
# 9  Optuna hyper-parameter search (separate entry-point)
# ---------------------------------------------------------------------------
optuna:
  enable: true
  study_name: wb_maxent_france
  storage: sqlite:///outputs/optuna_wb.db
  direction: maximize
  n_trials: 50
  objective_metric: AUC       # Options: AUC, boyce, PR-AUC
  timeout_minutes: null     # No wall-time limit
  search_space:
    regularization_multiplier:
      low: 0.5
      high: 4.0
      step: 0.5
    feature_types:
      choices:
        - lqp          # linear + quadratic + product
        - lqpt         # add threshold
        - auto         # all enabled
    num_background:
      low: 20000
      high: 100000
      step: 10000
    beta_lqp:          # elapid-specific shape parameter
      low: 0.0
      high: 1.0
      step: 0.1

# ---------------------------------------------------------------------------
# 10  Output folders
# ---------------------------------------------------------------------------
outputs:
  root: outputs/
  logs_dir: outputs/logs/
  model_dir: outputs/models/
  maps_dir: outputs/maps/
  figures_dir: outputs/figures/

# Raster mask defining the study area. Cells with value ``1`` are
# processed and receive predictions. All other cells are ignored.
boundary_mask: data/boundary_france.asc

# ---------------------------------------------------------------------------
# 11  Data file references
# ---------------------------------------------------------------------------
paths:
  presence_database: data/allpoints.csv
  bioclim_directory: data/bioclim
  land_cover_directory: data/land-cover
  vegetation_indices_directory: data/sat-indices
  hunting_bag_directory: data/hunting-bag
  theia_special_directory: data/theia-special
  theia_special_distance_directory: data/theia-special
  dem_altitude: data/dem/DEM_Altitude.asc
  dem_slope: data/dem/DEM_Slope.asc
  dem_terrain_ruggedness: data/dem/DEM_Terrain_Ruggedness.asc
  dem_aspect: data/dem/DEM_Aspect.asc
  dem_elevation_range: data/dem/DEM_Elevation_Range.asc
  fragmentation_density: data/special/fragmentation_density.asc
  wildareas_humanfootprint: data/special/wildareas_humanfootprint.asc
  zones_humides_inpn: data/special/Zones_humides_INPN.asc
  small_woody_features: data/special/small_woody_features.asc
